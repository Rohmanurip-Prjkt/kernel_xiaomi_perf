name: Kernel Build (Munch kgsl)
on:
  workflow_dispatch:
    inputs:
      KERNEL_TREE:
        description: "Kernel Tree URL"
        default: "https://github.com/bimoalfarrabi/kernel_xiaomi_sm8250_n0kontzz"
        required: true
      KERNELSU_SETUP_URL:
        description: "KernelSU setup.sh URL (leave blank to disable)"
        default: "https://raw.githubusercontent.com/Impqxr/KernelSU-Next/next-susfs/kernel/setup.sh"
        required: false
      KERNELSU_SETUP_BRANCH:
        description: "KernelSU Branch"
        default: "next-susfs"
        required: false
      ANYKERNEL_URL:
        description: "AnyKernel URL (leave blank to disable)"
        default: "https://github.com/bimoalfarrabi/AKmunch"
        required: false
      ANYKERNEL_BRANCH:
        description: "AnyKernel Branch"
        default: "main"
        required: false
      ANYKERNEL_ZIP_NAME:
        description: "AnyKernel zip name (without .zip)"
        default: "N0Kontzzz-munch"
        required: false
      CLANG_DOWNLOAD_URL:
        description: "Clang download URL"
        default: "https://github.com/Impqxr/aosp_clang_ci/releases/download/13289611/clang-13289611-linux-x86.tar.xz"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [susfs-uv-kgsl]
      fail-fast: false
    env:
      KERNEL_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Get current date and time (WIB)
        id: datetime
        run: |
          echo "TIMESTAMP=$(TZ='Asia/Jakarta' date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          echo "HUMAN_DATE=$(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M')" >> $GITHUB_ENV
      - name: Display Inputs
        run: |
          echo "::group::Inputs"
          echo "Kernel Tree: ${{ github.event.inputs.KERNEL_TREE }}"
          echo "Kernel Variant: ${{ matrix.variant }}"
          echo "KernelSU Setup URL: ${{ github.event.inputs.KERNELSU_SETUP_URL }}"
          echo "KernelSU Branch: ${{ github.event.inputs.KERNELSU_SETUP_BRANCH }}"
          echo "AnyKernel URL: ${{ github.event.inputs.ANYKERNEL_URL }}/tree/${{ github.event.inputs.ANYKERNEL_BRANCH }}"
          echo "AnyKernel Zip Name: ${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}"
          echo "Timestamp: $TIMESTAMP"
          echo "::endgroup::"
      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-ci
          restore-keys: |
            clang-
      - name: Download and Extract Clang (if not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          wget "${{ github.event.inputs.CLANG_DOWNLOAD_URL }}" -O clang.tar.gz
          mkdir -p clang
          tar -xf clang.tar.gz -C clang
          cd clang
          if [ -d clang-* ]; then
            mv clang-*/* .
          fi
          cd ..
          rm clang.tar.gz
      - name: Clone Kernel Source (branch susfs-v1.5.5-uv-kgsl)
        run: |
          git clone --depth=1 "${{ github.event.inputs.KERNEL_TREE }}" -b "susfs-v1.5.5-munch-uv-kgsl" kernel_tree
      - name: Set KernelSU Environment Variables (default to inputs)
        run: |
          echo "KERNELSU_NAME=KSUN" >> $GITHUB_ENV
          echo "KERNELSU_SETUP_URL=${{ github.event.inputs.KERNELSU_SETUP_URL }}" >> $GITHUB_ENV
          echo "KERNELSU_SETUP_BRANCH=${{ github.event.inputs.KERNELSU_SETUP_BRANCH }}" >> $GITHUB_ENV
          echo "KERNELSU_PATCHES=" >> $GITHUB_ENV
      - name: Building kernel
        run: |
          export ARCH=arm64
          export SUBARCH=ARM64
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="github.com"
          export TZ=Asia/Jakarta
          if [[ -n "$KERNELSU_SETUP_URL" && -n "$KERNELSU_SETUP_BRANCH" ]]; then
            curl -LSs "$KERNELSU_SETUP_URL" | bash -s "$KERNELSU_SETUP_BRANCH"
            if [ -n "$KERNELSU_PATCHES" ]; then
              cd Kernel*
              echo "$KERNELSU_PATCHES" | tr ',' '\n' | while read -r PATCH; do
                TRIMMED=$(echo "$PATCH" | xargs)
                TEMP_PATCH_FILE="/tmp/downloaded_patch_$(date +%s%N).patch"
                curl -fsSL "$TRIMMED" -o "$TEMP_PATCH_FILE"
                patch -p1 < "$TEMP_PATCH_FILE"
              done
              cd ..
            fi
          fi
          make O=out vendor/munch_defconfig PATH="$(pwd)/../clang/bin:$PATH"
          make O=out CC=clang -j$(nproc --all) PATH="$(pwd)/../clang/bin:$PATH" CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1
        working-directory: kernel_tree
      - name: Package AnyKernel3 (if enabled)
        if: ${{ success() && github.event.inputs.ANYKERNEL_URL != '' && github.event.inputs.ANYKERNEL_BRANCH != '' && github.event.inputs.ANYKERNEL_ZIP_NAME != '' }}
        run: |
          cd kernel_tree/out/arch/arm64/boot/
          git clone --recursive --depth=1 ${{ github.event.inputs.ANYKERNEL_URL }} -b ${{ github.event.inputs.ANYKERNEL_BRANCH }} AnyKernel3
          cp -f Image.gz AnyKernel3/
          if [ -e "dtb.img" ]; then
            cp -f dtb.img AnyKernel3/dtb
          fi
          if [ -e "dtbo.img" ]; then
            cp -f dtbo.img AnyKernel3/
          fi
          cd AnyKernel3
          zip -q -r "../${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}-${{ matrix.variant }}-${{ env.TIMESTAMP }}.zip" *
          cd .. 
          cd ../../../../..
      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        if: ${{ success() && github.event.inputs.ANYKERNEL_URL != '' && github.event.inputs.ANYKERNEL_BRANCH != '' && github.event.inputs.ANYKERNEL_ZIP_NAME != '' }}
        with:
          name: ${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}-${{ matrix.variant }}-${{ env.TIMESTAMP }}
          path: kernel_tree/out/arch/arm64/boot/${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}-${{ matrix.variant }}-${{ env.TIMESTAMP }}.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.ANYKERNEL_ZIP_NAME != '' }}
    steps:
      - name: Download all AnyKernel3 zips
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.event.inputs.ANYKERNEL_ZIP_NAME }}-*
          merge-multiple: true
          path: ./release-artifacts
      - name: Generate Variants Text
        id: variants
        run: |
          VARIANTS_TEXT=""
          for f in release-artifacts/*.zip; do
            VARIANT=$(basename "$f" | sed -E 's/^.+-munch-(.+)-[0-9]{8}-[0-9]{4}\.zip$/\1/')
            VARIANTS_TEXT="${VARIANTS_TEXT}- ${VARIANT}\n"
          done
          echo "VARIANTS_TEXT<<EOF" >> $GITHUB_OUTPUT
          echo -e "${VARIANTS_TEXT}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Prepare Release Tag
        id: prepare
        run: |
          TAG="auto-release-$(TZ='Asia/Jakarta' date +'%Y%m%d-%H%M')"
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          
      - name: Generate Release Notes
        run: |
          cat > release_notes.md << EOF
          # N0Kontzzz for Munch (${{ steps.prepare.outputs.release_tag }} KGSL)

          Build Date: $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M')

          ## Kernel Variants
          ${{ steps.variants.outputs.VARIANTS_TEXT }}
          ## Changelogs
          - Introduced KGSL Skip Pool Zeroing.

          ## Notes
          - No bypass charging
          - Introduced KGSL Skip Pool Zeroing, improves fps in emulator games by reducing kgsl memory pool operation. Can be toggled via /sys/kernel/e404/kgsl_skip_zeroing, 1 to enable, 0 to disable.

          ## Installation
          Flash via recovery or KernelFlasher app.

          ## Credits
          - **@EmanuelCN**: N0Kernel development.
          - **@rifsxd**: KernelSU-Next.
          - **@simonpunk & @sidex15**: SUSFS.
          - **@Impqxr**: N0Kernel fork & help.
          - **@re-noroi & @SenseiiX**: UV commit.
          - **@kvsnr113 & @SenseiiX**: Efficient cpu freq commit.
          - **@kvsnr113**: kgsl pool commit.
          - **@osm0sis**: AnyKernel3 framework.
          - **Google**: Clang compiler.
          - **All testers and contributors**: For their valuable feedback and support.
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.release_tag }}
          name: "N0Kontzzz for Munch ${{ steps.prepare.outputs.release_tag }} KGSL"
          body_path: release_notes.md
          files: |
            release-artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
